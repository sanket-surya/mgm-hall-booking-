<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sir Vishveshwaraiah Conference Hall Booking System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <img class="login-logo" src="images/college-logo.png" alt="MGM's College of Engineering Nanded logo" />
    <h1>Sir Vishveshwaraiah Conference Hall Booking System</h1>
    <span class="subtitle">MGM's College of Engineering, Nanded</span>

    <div id="login-message" class="form-message error" hidden></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">College email</label>
        <input type="email" id="email" name="email" placeholder="name@mgmce.ac.in" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <div class="demo-box" id="demo-box">
      <div class="demo-title">⚡ Quick Demo Login:</div>
      <div class="demo-buttons">
        <button type="button" class="btn btn-secondary" id="btn-demo-admin" title="Admin Account">Admin (Sanket)</button>
        <button type="button" class="btn btn-secondary" id="btn-demo-faculty" title="Faculty Account">Faculty</button>
        <button type="button" class="btn btn-secondary" id="btn-demo-organizer" title="Organizer Account">Organizer</button>
      </div>
    </div>

    <p class="login-footnote">Access is limited to Admin, Faculty and Organizer accounts.<br>Contact an admin if you need access.</p>
  </div>
</div>

<script type="module">
  import { initLoginForm } from "./js/auth.js";
  initLoginForm();

  // Quick Demo Fill buttons
  document.getElementById("btn-demo-admin")?.addEventListener("click", () => {
    document.getElementById("email").value = "sanket@mgmce.ac.in";
    document.getElementById("password").value = "sanket123";
    document.getElementById("login-form").querySelector("button[type=submit]").click();
  });
  document.getElementById("btn-demo-faculty")?.addEventListener("click", () => {
    document.getElementById("email").value = "faculty@mgmce.ac.in";
    document.getElementById("password").value = "faculty123";
    document.getElementById("login-form").querySelector("button[type=submit]").click();
  });
  document.getElementById("btn-demo-organizer")?.addEventListener("click", () => {
    document.getElementById("email").value = "organizer@mgmce.ac.in";
    document.getElementById("password").value = "organizer123";
    document.getElementById("login-form").querySelector("button[type=submit]").click();
  });
</script>

</body>
</html>
