<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sir Vishveshwaraiah Conference Hall Booking System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <img class="login-logo" src="images/college-logo.png" alt="MGM's College of Engineering Nanded logo" />
    <h1>Sir Vishveshwaraiah Conference Hall Booking System</h1>
    <span class="subtitle">MGM's College of Engineering, Nanded</span>

    <div id="login-message" class="form-message error" hidden></div>

    <div class="auth-tabs" style="display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--color-border); padding-bottom: 12px;">
      <button type="button" id="tab-login" class="btn btn-sm btn-primary" style="flex: 1;">Sign In</button>
      <button type="button" id="tab-register" class="btn btn-sm btn-secondary" style="flex: 1;">Register Account</button>
    </div>

    <!-- SIGN IN FORM -->
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">College email</label>
        <input type="email" id="email" name="email" placeholder="name@mgmcen.ac.in" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <!-- REGISTER FORM (Faculty / Organizer) -->
    <form id="register-form" hidden novalidate>
      <div class="field">
        <label for="reg-name">Full name</label>
        <input type="text" id="reg-name" placeholder="Prof. / Mr. / Ms. Full Name" required />
      </div>
      <div class="field">
        <label for="reg-email">College email</label>
        <input type="email" id="reg-email" placeholder="username@mgmcen.ac.in" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="reg-role">Role</label>
          <select id="reg-role" required>
            <option value="faculty">Faculty</option>
            <option value="organizer">Event Organizer</option>
          </select>
        </div>
        <div class="field">
          <label for="reg-department">Branch / Department</label>
          <select id="reg-department" required>
            <option value="" disabled selected>Select Branch</option>
            <option value="Computer Science & Engineering (CSE)">Computer Science & Engineering (CSE)</option>
            <option value="Information Technology (IT)">Information Technology (IT)</option>
            <option value="AI & Data Science (AIDS)">AI & Data Science (AIDS)</option>
            <option value="Electronics & Telecommunication (ETC)">Electronics & Telecommunication (ETC)</option>
            <option value="Mechanical Engineering (MECH)">Mechanical Engineering (MECH)</option>
            <option value="Civil Engineering (CIVIL)">Civil Engineering (CIVIL)</option>
            <option value="Electrical Engineering (EE)">Electrical Engineering (EE)</option>
            <option value="Applied Science & Humanities (ASH)">Applied Science & Humanities (ASH)</option>
            <option value="Administration / Office">Administration / Office</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="Min 6 characters" minlength="6" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Register Account</button>
      <p class="field-hint" style="margin-top: 8px; text-align: center; color: var(--color-ink-faint);">🔒 Note: New accounts require Admin approval before first login.</p>
    </form>

    <p class="login-footnote" id="login-footnote">Access is limited to authorized staff with a college email.<br>Domain: <code>@mgmcen.ac.in</code></p>
  </div>
</div>

<script type="module">
  import { initLoginForm } from "./js/auth.js";
  initLoginForm();
</script>

</body>
</html>
